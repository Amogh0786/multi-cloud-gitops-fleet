apiVersion: container.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  name: gke-cluster
spec:
  forProvider:
    location: us-central1-a
    initialNodeCount: 1
    removeDefaultNodePool: true
  providerConfigRef:
    name: default
---
apiVersion: container.gcp.upbound.io/v1beta1
kind: NodePool
metadata:
  name: gke-nodepool
spec:
  forProvider:
    clusterRef:
      name: gke-cluster
    location: us-central1-a
    nodeCount: 2
    nodeConfig:
      - machineType: e2-medium
        oauthScopes:
          - https://www.googleapis.com/auth/cloud-platform
  providerConfigRef:
    name: default
