apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-gitops-label
spec:
  validationFailureAction: Enforce
  rules:
  - name: check-for-labels
    match:
      any:
      - resources:
          kinds:
          - Deployment
    validate:
      message: "label 'gitops-managed: true' is required"
      pattern:
        metadata:
          labels:
            gitops-managed: "true"
